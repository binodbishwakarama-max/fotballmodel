services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bwb_forecast
      POSTGRES_USER: bwb_forecast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bwb_forecast -d bwb_forecast"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build: .
    command:
      - sh
      - -c
      - uv run --locked bwb init-db && exec uv run --locked bwb serve --host 0.0.0.0
    environment:
      DATABASE_URL: postgresql+psycopg://bwb_forecast:${POSTGRES_PASSWORD}@db:5432/bwb_forecast
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - model_data:/app/models
      - ledger_data:/app/ledger
      - report_data:/app/reports
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  postgres_data:
  model_data:
  ledger_data:
  report_data:
